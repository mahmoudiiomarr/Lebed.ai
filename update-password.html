<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reset Password — LEBED.ai</title>
<link rel="icon" type="image/png" href="logo%20pref.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="canvas-bg"></canvas>

<div class="auth-overlay active" aria-hidden="false" style="position:fixed;">
  <section class="auth-shell" role="dialog" aria-modal="true" aria-labelledby="updatePasswordTitle">
    <div class="auth-brand">
      <img src="logo%20pref.png" alt="LEBED.ai" class="auth-logo">
      <span>LEBED<span>.ai</span></span>
      <small>IDENTITY CORE / 0.3</small>
    </div>

    <div class="auth-kicker">RESET PASSWORD</div>
    <h2 id="updatePasswordTitle">Choose a new password</h2>
    <p class="auth-copy" id="updatePasswordStatus">Verifying your reset link&hellip;</p>

    <form id="updatePasswordForm" novalidate hidden>
      <div class="float-field">
        <input id="newPassword" type="password" placeholder=" " autocomplete="new-password" required>
        <label for="newPassword">New password</label>
      </div>
      <div class="strength-meter">
        <div class="strength-track"><div id="strengthBar"></div></div>
        <span id="strengthText">Use 8+ characters</span>
      </div>
      <div class="float-field">
        <input id="confirmPassword" type="password" placeholder=" " autocomplete="new-password" required>
        <label for="confirmPassword">Confirm new password</label>
      </div>
      <p class="auth-error" id="updatePasswordError" role="alert"></p>
      <button class="auth-submit" type="submit">Update password <span>&rarr;</span></button>
    </form>

    <p class="auth-switch"><a href="index.html" class="text-link" style="text-decoration:none;">&larr; Back to LEBED.ai</a></p>
    <div class="auth-footer"><span class="pulse-dot"></span> End-to-end identity protocol ready</div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="update-password.js"></script>
</body>
</html>
